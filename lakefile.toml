name = "block-cycle-rotation"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["BlockCycleRotation"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# This project is not Mathlib: its file-header and `#`-command house rules
# do not apply, and `#guard` is used deliberately for sanity checks.
weak.linter.style.header = false
weak.linter.hashCommand = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "BlockCycleRotation"
